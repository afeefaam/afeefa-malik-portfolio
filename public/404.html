<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect shim (github.com/rafgraph/spa-github-pages).
      // Encodes the requested deep-link path into a query string and redirects
      // to the app root; index.html's decoder restores it via history.replaceState
      // before React mounts, so React Router still sees the original URL.
      //
      // pathSegmentsToKeep = number of path segments that belong to the site's
      // base path, not the app route. Set to 1 for a project site deployed at
      // github.com/<user>/<repo> -> <user>.github.io/<repo>/ (the default here).
      // Set to 0 if this is deployed as a root user/org site (<user>.github.io).
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
